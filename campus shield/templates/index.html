<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusFix & Shield - Redressal Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- NAVIGATION HEADER -->
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 py-3 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-black text-lg shadow-md">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div>
          <span class="font-black text-slate-900 tracking-tight text-lg">CampusFix</span>
          <span class="text-[10px] bg-rose-50 text-rose-600 font-bold px-1.5 py-0.5 rounded border border-rose-200 uppercase tracking-widest ml-1">Shield</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <!-- Student Google Login Button -->
        <a href="/login/google" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-slate-700 text-xs font-bold hover:bg-slate-100 transition-all shadow-sm no-underline">
          <svg width="14" height="14" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Student Login</span>
        </a>

        <!-- Admin Access Button -->
        <button onclick="openAdminModal()" class="border border-slate-300 hover:bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm">
          <i class="fa-solid fa-key text-slate-400"></i> Admin Access
        </button>

        <!-- Instant SOS Button -->
        <button onclick="dispatchLiveSOS()" class="bg-rose-600 hover:bg-rose-700 text-white px-3.5 py-1.5 rounded-lg font-bold text-xs shadow-md transition-all">
          <i class="fa-solid fa-bell"></i> Instant SOS
        </button>
      </div>
    </div>
  </nav>

  <!-- MAIN GRIEVANCE FORM CONTAINER -->
  <main class="max-w-2xl mx-auto w-full px-4 py-8 flex-grow">
    <div class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-200">
      <div class="mb-6">
        <h1 class="text-xl font-black text-slate-900 tracking-tight">Lodge Incident / Maintenance Request</h1>
        <p class="text-xs text-slate-500 mt-1">Submit your grievance directly to administrative authorities.</p>
      </div>

      <form id="grievanceForm" onsubmit="submitForm(event)" class="space-y-5">
        <!-- Category Selection -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Category *</label>
          <select id="issueCat" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
            <option value="Computer Lab & Network">Computer Lab & Network</option>
            <option value="Drinking Water">Drinking Water</option>
            <option value="Electrical / Lighting">Electrical / Lighting</option>
            <option value="Cleanliness / Sanitation">Cleanliness / Sanitation</option>
            <option value="Campus Security">Campus Security</option>
            <option value="General Infrastructure">General Infrastructure</option>
          </select>
        </div>

        <!-- Anonymous Checkbox -->
        <div class="flex items-center gap-2 py-1">
          <input type="checkbox" id="anonToggle" onchange="handleAnonToggle()" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer" />
          <label for="anonToggle" class="text-xs font-semibold text-slate-600 cursor-pointer select-none">
            Submit Anonymously (Hide Name and Roll Number)
          </label>
        </div>

        <!-- Student Details Fields -->
        <div id="studentInputRow" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Student Name *</label>
            <input type="text" id="studName" placeholder="Enter Full Name" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Student Roll / ID *</label>
            <input type="text" id="studRoll" placeholder="e.g. 24CSE001" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required />
          </div>
        </div>

        <!-- Location & Priority Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Precise Location / Room No. *</label>
            <input type="text" id="issueLoc" placeholder="e.g. Computer Lab 2, 1st Floor" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Priority Level *</label>
            <select id="issuePrio" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
              <option value="Normal">Normal</option>
              <option value="High Priority (Urgent Repair)">High Priority (Urgent Repair)</option>
              <option value="Critical Immediate Attention">Critical Immediate Attention</option>
            </select>
          </div>
        </div>

        <!-- Description -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Incident / Breakdown Description *</label>
          <textarea id="issueDesc" rows="4" placeholder="Detail the problem clearly..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required></textarea>
        </div>

        <!-- Attachment (Optional) -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Evidence (Optional)</label>
          <input type="file" id="mediaProof" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer" />
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-all text-sm flex items-center justify-center gap-2">
          <span>Submit Grievance</span>
        </button>
      </form>
    </div>
  </main>

  <!-- ADMIN ACCESS POPUP MODAL -->
  <div id="adminKeyModal" class="hidden fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl relative border border-slate-100 text-center">
      <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      
      <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-xl mx-auto mb-3">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h3 class="font-extrabold text-slate-900 text-base">Admin Security Key</h3>
      <p class="text-xs text-slate-500 mt-0.5 mb-5">Enter Master Passcode to open Control Hub.</p>

      <form onsubmit="submitAdminKey(event)" class="space-y-4">
        <div>
          <input type="password" id="adminSecretInput" required placeholder="Enter Security Passcode" autocomplete="current-password" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none text-center tracking-widest font-mono" />
        </div>
        <button type="submit" id="unlockBtn" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all">
          Unlock Console
        </button>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-slate-950 text-slate-400 py-6 text-center text-xs">
    <p>&copy; 2026 CampusFix & Shield. Automated Redressal Engine.</p>
  </footer>

  <!-- CLIENT SCRIPTS -->
  <script>
    function handleAnonToggle() {
      const isAnon = document.getElementById('anonToggle').checked;
      const row = document.getElementById('studentInputRow');
      const studName = document.getElementById('studName');
      const studRoll = document.getElementById('studRoll');

      if (isAnon) {
        row.classList.add('opacity-30', 'pointer-events-none');
        studName.removeAttribute('required');
        studRoll.removeAttribute('required');
      } else {
        row.classList.remove('opacity-30', 'pointer-events-none');
        studName.setAttribute('required', '');
        studRoll.setAttribute('required', '');
      }
    }

    async function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Submitting...";
      btn.disabled = true;

      const fileInput = document.getElementById('mediaProof');
      const payload = {
        category: document.getElementById('issueCat').value,
        is_anonymous: document.getElementById('anonToggle').checked,
        name: document.getElementById('studName').value,
        roll: document.getElementById('studRoll').value,
        location: document.getElementById('issueLoc').value,
        priority: document.getElementById('issuePrio').value,
        description: document.getElementById('issueDesc').value,
        evidence_file: (fileInput.files && fileInput.files[0]) ? fileInput.files[0].name : "None"
      };

      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok && data.status === 'success') {
          alert("Grievance lodged successfully! Token ID: " + data.token);
          document.getElementById('grievanceForm').reset();
          handleAnonToggle();
        } else {
          alert("Error in submission: " + (data.message || "Unknown error"));
        }
      } catch (err) {
        alert("Network or Server error: " + err.message);
      } finally {
        btn.innerText = "Submit Grievance";
        btn.disabled = false;
      }
    }

    function openAdminModal() {
      document.getElementById('adminKeyModal').classList.remove('hidden');
      document.getElementById('adminSecretInput').focus();
    }

    function closeAdminModal() {
      document.getElementById('adminKeyModal').classList.add('hidden');
      document.getElementById('adminSecretInput').value = '';
    }

    async function submitAdminKey(e) {
      e.preventDefault();
      const keyVal = document.getElementById('adminSecretInput').value;
      const unlockBtn = document.getElementById('unlockBtn');
      unlockBtn.innerText = "Verifying...";
      unlockBtn.disabled = true;

      try {
        const res = await fetch('/api/verify-admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: keyVal })
        });

        const data = await res.json();
        if (res.ok && data.status === 'success') {
          window.location.href = data.redirect || '/admin-panel';
        } else {
          alert(data.message || "Invalid Security Passcode");
        }
      } catch (err) {
        alert("Connection error: " + err.message);
      } finally {
        unlockBtn.innerText = "Unlock Console";
        unlockBtn.disabled = false;
      }
    }

    async function dispatchLiveSOS() {
      if (!confirm("Activate Instant SOS Emergency Alert?")) return;
      try {
        const res = await fetch('/api/sos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ location: 'Triggered from Quick SOS Header' })
        });
        const data = await res.json();
        alert(data.message || "SOS Transmitted");
      } catch (err) {
        alert("SOS transmission failed: " + err.message);
      }
    }
  </script>
</body>
</html>
