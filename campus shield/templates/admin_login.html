<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Authentication - Campus Shield</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-2xl mx-auto mb-3 shadow-lg">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h1 class="text-xl font-black tracking-tight text-white">Central Security Portal</h1>
      <p class="text-xs text-slate-400 mt-1">Authorized Administration & Dispatch Sign-In</p>
    </div>

    <form action="/admin-login-post" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Master Security Passcode</label>
        <input type="password" name="admin_key" placeholder="Enter Passcode" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white font-mono text-center tracking-widest text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required autofocus>
      </div>

      <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-sm rounded-xl shadow-lg transition">
        Unlock Security Console
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="/" class="text-xs text-slate-500 hover:text-slate-300 font-semibold no-underline">
        <i class="fa-solid fa-arrow-left mr-1"></i> Return to Student Portal
      </a>
    </div>
  </div>

</body>
</html>
